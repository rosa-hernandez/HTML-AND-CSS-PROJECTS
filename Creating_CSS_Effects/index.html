<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="description" content="Images of Japan Temple">
    <title>Creating Effects with CSS</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <!--NAVBAR-->
    <nav class="nav-bar">
        <ul>
            <li>
                <a href="#">Home</a>
            </li>
            <li class="drop">
                <a href="#">Images</a>
                <div class="rollover-menu">
                    <a href="#image1">image 1</a>
                    <a href="#image2">image 2</a>
                    <a href="#image3">image 3</a>
                </div>
            </li>
        </ul>
    </nav>
    <!--IMAGES-->
    <section>
        <!--IMAGE ONE-->
        <div class="image-container" id="image1">
            <img src="images/Japan_one.jpg">
            <div class="overlay"></div>
        </div>
        <!--IMAGE TWO-->
        <div class="image-container" id="image2">
            <img src="images/Japan_two.jpg" class="zoom">
        </div>
        <!--IMAGE THREE-->
        <div class="image-container" id="image3">
            <div class="circle">
                <img src="images/Japan_three.jpg">
            </div>
        </div>
    </section>
    <!--FOOTER-->
    <footer>
        <div class="footer-text">
            <p>The Tech Academy &copy;</p>
        </div>
    </footer>
</body>
</html>
